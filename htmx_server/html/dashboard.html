{% load i18n %}
<div class="max-w-7xl mx-auto dashboard-page">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-8">
        <div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">{% trans "Dashboard" %}</h1>
            <p class="text-gray-500 text-sm">{% trans "Business health & operations overview" %}</p>
        </div>
        <div class="period-switch" aria-label="{% trans 'Period:' %}">
            <button type="button" data-period="week" aria-pressed="{% if period == 'week' %}true{% else %}false{% endif %}"
                    hx-get="{% url 'dashboard' %}?period=week" hx-target="#dashboard-body" hx-push-url="false">
                {% trans "Last 7 Days" %}
            </button>
            <button type="button" data-period="month" aria-pressed="{% if period == 'month' %}true{% else %}false{% endif %}"
                    hx-get="{% url 'dashboard' %}?period=month" hx-target="#dashboard-body" hx-push-url="false">
                {% trans "This Month" %}
            </button>
        </div>
    </div>
    <div id="dashboard-body">
        {% include 'partials/dashboard_content.html' %}
    </div>
</div>

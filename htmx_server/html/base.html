{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zongii{% endblock %}</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Apply saved theme before first paint (no flash of wrong theme) -->
    <script>
        try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* HTMX Loading state logic */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }

        /* App ambient background */
        .app-bg {
            background:
                radial-gradient(80% 60% at 100% 0%, rgba(245,158,11,0.06) 0%, transparent 60%),
                radial-gradient(70% 60% at 0% 100%, rgba(100,116,139,0.06) 0%, transparent 55%),
                #eef1f5;
        }
        /* Smooth content swap */
        #main-content > * { animation: contentIn .35s cubic-bezier(.16,1,.3,1) both; }
        @keyframes contentIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

        /* ════════════════════════════════════════════════════════════
           DARK THEME
           Driven from `html.dark`; the extra `html.dark` qualifier raises
           specificity above single Tailwind utilities, so neutral surfaces,
           text and borders invert app-wide without per-template edits.
           Brand accents (amber-500/600 etc.) are intentionally left alone.
           ════════════════════════════════════════════════════════════ */
        html.dark { color-scheme: dark; }
        html.dark body, html.dark.app-bg, html.dark .app-bg {
            background:
                radial-gradient(80% 60% at 100% 0%, rgba(245,158,11,0.10) 0%, transparent 60%),
                radial-gradient(70% 60% at 0% 100%, rgba(148,163,184,0.08) 0%, transparent 55%),
                #0a0f1a;
        }

        /* Surfaces (cards / panels) */
        html.dark .bg-white,
        html.dark .bg-white\/90,
        html.dark .bg-white\/80,
        html.dark .bg-white\/60 { background-color: #0f172a; }

        /* Secondary surfaces (subtle fills, table heads, chips) */
        html.dark .bg-gray-50,  html.dark .bg-gray-100,
        html.dark .bg-gray-50, html.dark .bg-gray-100,
        html.dark .bg-gray-50\/80, html.dark .bg-gray-50\/60 { background-color: #1e293b; }

        /* Neutral hover fills */
        html.dark .hover\:bg-gray-50:hover,
        html.dark .hover\:bg-gray-100:hover,
        html.dark .hover\:bg-gray-50:hover,
        html.dark .hover\:bg-gray-50\/60:hover,
        html.dark .hover\:bg-gray-50\/60\:hover,
        html.dark .hover\:bg-amber-50\/70:hover,
        html.dark .hover\:bg-gray-50\/60:hover { background-color: #243042; }

        /* Text */
        html.dark .text-gray-900, html.dark .text-gray-900,
        html.dark .text-gray-800, html.dark .text-gray-800 { color: #f1f5f9; }
        html.dark .text-gray-700, html.dark .text-gray-700,
        html.dark .text-gray-600, html.dark .text-gray-600 { color: #cbd5e1; }
        html.dark .text-gray-500, html.dark .text-gray-500,
        html.dark .text-gray-400, html.dark .text-gray-400 { color: #94a3b8; }

        /* Borders, dividers, rings */
        html.dark .border-gray-50,  html.dark .border-gray-100, html.dark .border-gray-200,
        html.dark .border-gray-100, html.dark .border-gray-200,
        html.dark .border-gray-200\/70, html.dark .border-b, html.dark .border-t { border-color: #1f2a3b; }
        html.dark .divide-gray-50 > :not([hidden]) ~ :not([hidden]),
        html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]),
        html.dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: #1f2a3b; }
        html.dark .ring-gray-200, html.dark .ring-gray-200\/70 { --tw-ring-color: #1f2a3b; }

        /* Form controls */
        html.dark input:not([type=checkbox]):not([type=radio]),
        html.dark textarea, html.dark select {
            background-color: #0b1220;
            border-color: #334155;
            color: #e2e8f0;
        }
        html.dark input::placeholder, html.dark textarea::placeholder { color: #64748b; }

        /* Tinted alert / badge backgrounds → muted dark tints */
        html.dark .bg-amber-50   { background-color: rgba(245,158,11,0.12); }
        html.dark .bg-amber-100  { background-color: rgba(245,158,11,0.18); }
        html.dark .bg-green-50, html.dark .bg-green-50  { background-color: rgba(16,185,129,0.12); }
        html.dark .bg-green-100, html.dark .bg-green-100 { background-color: rgba(16,185,129,0.18); }
        html.dark .bg-red-50, html.dark .bg-red-50   { background-color: rgba(244,63,94,0.12); }
        html.dark .bg-red-100, html.dark .bg-red-100 { background-color: rgba(244,63,94,0.18); }
        html.dark .bg-blue-50    { background-color: rgba(59,130,246,0.12); }
        html.dark .bg-blue-100   { background-color: rgba(59,130,246,0.18); }

        /* Dark scrollbars */
        html.dark ::-webkit-scrollbar-thumb { background: #334155; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="app-bg text-gray-700">

    <main class="mx-auto flex w-full min-h-screen">
  {% include 'snippets/aside.html' %}

        <div class="flex-1 bg-white/90 backdrop-blur-sm m-2 rounded-2xl ring-1 ring-gray-200/70 shadow-[0_8px_30px_-12px_rgba(15,23,42,0.12)] flex flex-col relative overflow-hidden">

            <div id="loading-spinner" class="htmx-indicator absolute inset-0 z-50 flex items-center justify-center bg-white/60 backdrop-blur-sm">
                <div class="flex flex-col items-center gap-3">
                    <span class="h-10 w-10 animate-spin rounded-full border-[3px] border-amber-500 border-t-transparent"></span>
                    <span class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-400">{% trans "Loading" %}</span>
                </div>
            </div>

            <div id="main-content" class="flex-1 p-4 overflow-y-auto">
                {% if messages %}
                    <div class="mb-4 space-y-2">
                        {% for message in messages %}
                            <div class="flex items-center gap-3 p-3.5 rounded-xl border text-sm font-medium
                                {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800
                                {% else %}bg-red-50 border-red-200 text-red-700{% endif %}">
                                <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill text-green-500{% else %}bi-exclamation-circle-fill text-red-500{% endif %}"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <div id="modal-backdrop"
         class="fixed inset-0 z-[60] hidden items-center justify-center bg-gray-900/50 backdrop-blur-sm"
         onclick="if(event.target===this) closeModal()">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl ring-1 ring-gray-200 max-w-lg w-full m-4"></div>
    </div>

    <script>
        // CSRF Token setup for HTMX (Crucial for Django POST)
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        // Modal Logic
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target.id === 'modal-content') {
                document.getElementById('modal-backdrop').classList.remove('hidden');
                document.getElementById('modal-backdrop').classList.add('flex');
            }
        });

        function closeModal() {
            const modal = document.getElementById('modal-backdrop');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('modal-content').innerHTML = '';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Theme toggle (persisted, broadcasts 'themechange' for charts etc.)
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
            syncThemeIcon();
            document.dispatchEvent(new CustomEvent('themechange', { detail: { dark: isDark } }));
        }
        function syncThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('[data-theme-icon]').forEach(el => {
                el.classList.toggle('bi-moon-stars', !isDark);
                el.classList.toggle('bi-sun', isDark);
            });
            document.querySelectorAll('[data-theme-label]').forEach(el => {
                el.textContent = isDark ? 'Light mode' : 'Dark mode';
            });
        }
        document.addEventListener('DOMContentLoaded', syncThemeIcon);
        syncThemeIcon();
    </script>
</body>
</html>

<div class="mt-3 rounded-2xl bg-indigo-50 border border-indigo-100 p-4 space-y-3">
    <div class="flex items-center justify-between">
        <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">
            <i class="bi bi-person-plus mr-1"></i>New Customer
        </span>
        <button type="button"
                onclick="document.getElementById('customer-quick-form').innerHTML=''"
                class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
    </div>

    {% if error %}
    <p class="text-xs text-red-500 font-semibold">{{ error }}</p>
    {% endif %}

    <form hx-post="{% url 'customer_quick_create' %}"
          hx-target="#customer-quick-form"
          hx-swap="innerHTML"
          class="space-y-2">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Full name *" required
               class="w-full border border-indigo-200 focus:border-indigo-400 rounded-xl px-3 py-2.5 text-sm bg-white outline-none transition">
        <div class="grid grid-cols-2 gap-2">
            <input type="tel" name="phone" placeholder="Phone"
                   class="border border-indigo-200 focus:border-indigo-400 rounded-xl px-3 py-2.5 text-sm bg-white outline-none transition">
            <input type="email" name="email" placeholder="Email"
                   class="border border-indigo-200 focus:border-indigo-400 rounded-xl px-3 py-2.5 text-sm bg-white outline-none transition">
        </div>
        <button type="submit"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black rounded-xl transition-all active:scale-[.98]">
            <i class="bi bi-check2 mr-1"></i>Create &amp; Select
        </button>
    </form>
</div>

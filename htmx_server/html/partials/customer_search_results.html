{% if customers %}
<div class="bg-white border border-gray-200 rounded-xl shadow-xl max-h-64 overflow-y-auto">
    {% for c in customers %}
    <div class="flex items-center gap-3 p-3 hover:bg-amber-50 cursor-pointer border-b border-gray-50 last:border-0 transition-colors"
         onmousedown="selectCustomer('{{ c.pk }}', '{{ c.name|escapejs }}')">
        <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
            <i class="bi bi-person text-amber-500 text-sm"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-gray-800 truncate">{{ c.name }}</p>
            <p class="text-[11px] text-gray-400 truncate">
                {% if c.phone %}{{ c.phone }}{% endif %}
                {% if c.phone and c.email %} · {% endif %}
                {% if c.email %}{{ c.email }}{% endif %}
            </p>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}

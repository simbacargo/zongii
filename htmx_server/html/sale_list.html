{% load i18n %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">{% trans "Sales History" %}</h1>
            <p class="text-gray-500">{% trans "View and manage transactions" %}</p>
        </div>
        <a hx-target="#main-content" hx-get="{% url 'sale_create' %}" href="#" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2 w-fit">
            <i class="bi bi-plus-lg"></i> {% trans "New Sale" %}
        </a>
    </div>

    <!-- Filters + Search row -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">

        <!-- Status tabs -->
        <div class="flex gap-2 p-1 bg-gray-200 w-fit rounded-xl shrink-0">
            <button hx-get="{% url 'sale_list' %}?q={{ q|urlencode }}" hx-target="#main-content" hx-push-url="false"
                    class="px-4 py-2 rounded-lg text-sm font-bold {% if not status_filter %}bg-white text-amber-600 shadow-sm{% else %}text-gray-600 hover:bg-gray-300{% endif %}">
                {% trans "All Sales" %}
            </button>
            <button hx-get="{% url 'sale_list' %}?status=pending&q={{ q|urlencode }}" hx-target="#main-content" hx-push-url="false"
                    class="px-4 py-2 rounded-lg text-sm font-bold {% if status_filter == 'pending' %}bg-white text-amber-600 shadow-sm{% else %}text-gray-600 hover:bg-gray-300{% endif %}">
                {% trans "Pending" %}
            </button>
            <button hx-get="{% url 'sale_list' %}?status=approved&q={{ q|urlencode }}" hx-target="#main-content" hx-push-url="false"
                    class="px-4 py-2 rounded-lg text-sm font-bold {% if status_filter == 'approved' %}bg-white text-green-600 shadow-sm{% else %}text-gray-600 hover:bg-gray-300{% endif %}">
                {% trans "Approved" %}
            </button>
        </div>

        <!-- Search -->
        <div class="relative flex-1 max-w-sm">
            <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
            <input type="text"
                   name="q"
                   value="{{ q }}"
                   placeholder="{% trans 'Search by ID (ZC001), product, customer…' %}"
                   class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-amber-400 bg-white"
                   hx-get="{% url 'sale_list' %}?status={{ status_filter }}"
                   hx-target="#main-content"
                   hx-trigger="input delay:350ms, keyup[key=='Enter']"
                   hx-include="this"
                   hx-push-url="false">
        </div>

    </div>

    <div id="sales-table-container" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        {% include "partials/sales_table.html" %}
    </div>
</div>
{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Businesses</h1>
            <p class="text-gray-500 text-sm">Manage your business entities</p>
        </div>
        <button hx-get="{% url 'business_create' %}" hx-target="#main-content"
                class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition-all shadow-sm shadow-indigo-200 active:scale-[.98]">
            <i class="bi bi-plus-lg"></i> New Business
        </button>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {% for biz in businesses %}
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex flex-col gap-4 hover:shadow-md transition-shadow">
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center shrink-0">
                    <i class="bi bi-building text-indigo-500"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-black text-gray-900 truncate">{{ biz.name }}</p>
                    <p class="text-xs text-gray-400 mt-0.5">Owner: {{ biz.owner.get_full_name|default:biz.owner.username }}</p>
                </div>
            </div>
            <div class="flex items-center gap-2 pt-2 border-t border-gray-50">
                <button hx-get="{% url 'business_detail' biz.pk %}" hx-target="#main-content"
                        class="flex-1 py-2 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-colors text-center">
                    View
                </button>
                {% if biz.owner == request.user %}
                <button hx-get="{% url 'business_update' biz.pk %}" hx-target="#main-content"
                        class="flex-1 py-2 text-xs font-bold text-gray-600 bg-gray-50 hover:bg-gray-100 rounded-xl transition-colors text-center">
                    Edit
                </button>
                <button hx-post="{% url 'business_delete' biz.pk %}"
                        hx-confirm="Delete '{{ biz.name }}'? This cannot be undone."
                        hx-target="#main-content"
                        class="py-2 px-3 text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors">
                    <i class="bi bi-trash3"></i>
                </button>
                {% endif %}
            </div>
        </div>
        {% empty %}
        <div class="col-span-3 bg-white rounded-2xl border border-gray-100 p-16 text-center">
            <div class="flex flex-col items-center opacity-30">
                <i class="bi bi-building text-5xl mb-3"></i>
                <p class="text-base font-bold">No businesses yet</p>
            </div>
            <button hx-get="{% url 'business_create' %}" hx-target="#main-content"
                    class="mt-6 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition-all">
                Create one
            </button>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}

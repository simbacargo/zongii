{% if count > 0 %}
<span hx-get="{% url 'notification_badge' %}"
      hx-trigger="every 60s"
      hx-target="this"
      hx-swap="outerHTML"
      class="ml-auto text-[10px] font-black bg-red-500 text-white min-w-[18px] h-[18px] flex items-center justify-center rounded-full px-1 leading-none">
    {{ count }}
</span>
{% else %}
<span hx-get="{% url 'notification_badge' %}"
      hx-trigger="every 60s"
      hx-target="this"
      hx-swap="outerHTML"
      class="ml-auto"></span>
{% endif %}
